# MiBee NVR Configuration
# Copy to mibee-nvr.yaml and customize for your setup
# Or use: ./mibee-nvr init --password <your-password>
#
# All durations use Go duration format: 30s, 5m, 1h, 24h
# Camera IDs must be unique and kebab-case (e.g., "front-door")
# Enables, ports, and thresholds are validated on startup

# HTTP server listen address (default: ":9090")
server:
  listen: ":9090"

# Storage settings
# root_dir: where recordings, database, and HLS segments are stored.
# Docker: set via NVR_DATA_DIR env var (default /data). See deploy/docker/docker-compose.yml.
# Binary: set via --data-dir flag or directly in YAML.
storage:
  root_dir: "/var/lib/mibee-nvr"   # Change to your preferred path (e.g. /mnt/external/nvr)
  segment_duration: "30s"          # MP4 segment duration (max 30s on RPi)

# Authentication
# Option 1: Set password_hash (generate with: mibee-nvr hash-password <pw>)
# Option 2: Set password in plaintext (auto-converted to hash on first run)
auth:
  username: "admin"
  password_hash: ""  # Use `mibee-nvr hash-password <password>` to generate
  # password: ""      # Or set plaintext here (auto-hashed on first start)

# Camera configuration — add your cameras here
# Each camera must have a unique ID and valid URL with scheme + host
# Supported protocols: rtsp, http, onvif, xiaomi
# Supported encodings: h264, h265, mjpeg, jpeg
cameras: []
# Example cameras:
# cameras:
#   - id: "front-door"
#     name: "Front Door"
#     protocol: "rtsp"        # Transport: rtsp, http, onvif, xiaomi
#     encoding: "h264"         # Encoding: h264, h265, mjpeg, jpeg
#     url: "rtsp://192.168.1.100:554/stream"
#     enabled: true
#     audio_enabled: false          # Enable audio recording (default: false)
#     frame_watchdog_timeout: "30s"  # Timeout before declaring camera unhealthy (default: 30s)
#     timelapse:                      # Per-camera timelapse recording (see full reference below)
#       enabled: false               # Enable timelapse (default: false)
#       interval: "30s"              # Snapshot interval (default: 30s, min 1s)
#       # frame_source: "auto"       # How frames are captured. auto (default) resolves:
#                                   #   - rtsp_keyframe: RTSP/ONVIF H.264/H.265 cameras (subscribes to recorder's StreamHub, extracts IDR frames)
#                                   #   - latest_frame:  HTTP JPEG and RTSP MJPEG cameras (polls recorder's LatestFrame(), no extra connection)
#                                   #   Explicit values: "auto", "rtsp_keyframe", "latest_frame", "snapshot", "mjpeg"
#                                   #   snapshot: HTTP GET from snapshot_url (requires snapshot_url)
#                                   #   mjpeg: independent HTTP MJPEG pull (opens a second connection)
#       # snapshot_url: ""           # Required when frame_source=snapshot. Auto-derived from stream URL when empty.
#       # schedule:                  # Time-window recording (default: 24/7)
#       #   time_ranges: [{start: "06:00", end: "18:00"}]
#       #   days_of_week: [1,2,3,4,5]  # 0=Sunday … 6=Saturday; empty = all days
#       # paused: false              # Runtime pause (overrides schedule, set via API)
#       # merge_enabled: true        # Enable post-merge of timelapse segments into MP4 (default: true)
#       # merge_mode: "auto"         # auto | mp4 | jpeg (default: auto)
#       # merge_duration: "natural-day"  # Merge window: 8h, 12h, 24h, natural-day, 7d, 30d (default: natural-day)
#       # merge_output_fps: 30       # Output video FPS (default: 30, range 1-60)
#       # delete_original: false     # Delete source frames after merge (default: false)
#     health_overrides:              # Per-camera health threshold overrides
#       freeze_timeout: "10s"        # Timeout for detecting frozen stream (default: 10s)
#   - id: "backyard"
#     name: "Back Yard"
#     protocol: "http"
#     encoding: "jpeg"
#     url: "http://192.168.1.101/capture"
#     enabled: true
#     audio_enabled: false          # Enable audio recording (default: false). Not supported for MJPEG/HTTP-JPEG.
#     frame_watchdog_timeout: "30s"  # Timeout before declaring camera unhealthy (default: 30s)
#     timelapse:                      # Per-camera timelapse recording
#       enabled: false               # Enable timelapse (default: false)
#       interval: "30s"              # Snapshot interval (default: 30s)
#     health_overrides:              # Per-camera health threshold overrides
#       freeze_timeout: "10s"        # Timeout for detecting frozen stream (default: 10s)
#   - id: "xiaomi-cam"
#     name: "Xiaomi Camera"
#     protocol: "xiaomi"
#     encoding: "h264"
#     did: "xiaomi_device_id"      # Xiaomi Device ID
#     vendor: "cs2"                # Transport vendor: "cs2" (default)
#     enabled: true
#     audio_enabled: false          # Enable audio recording (default: false)
#     frame_watchdog_timeout: "30s"  # Timeout before declaring camera unhealthy (default: 30s)
#     timelapse:                      # Per-camera timelapse recording
#       enabled: false               # Enable timelapse (default: false)
#       interval: "30s"              # Snapshot interval (default: 30s)
#     health_overrides:              # Per-camera health threshold overrides
#       freeze_timeout: "10s"        # Timeout for detecting frozen stream (default: 10s)

# Xiaomi cloud account settings (required for xiaomi cameras)
# xiaomi:
#   user_id: ""    # Populated after first login
#   token: ""      # Xiaomi passToken (obtained via /api/xiaomi/auth)
#   region: "cn"   # Region: cn, sg, de, etc.

# Cleanup — retention and disk threshold policies
# Cleanup runs on a schedule and removes old recordings
cleanup:
  retention_days: 30               # Delete recordings older than N days (1-3650)
  check_interval: "1h"             # How often to check for expired recordings
  disk_threshold_percent: 85       # Start cleanup when disk usage exceeds N% (50-99). 85 avoids the HDD perf cliff near 90%+ full.

# Segment merging — combine short segments into longer recordings
# Two independent systems:
#   1. Periodic merge (enabled/check_interval): scans every interval, batch-merges
#      segments older than min_segment_age. Low IO impact, high latency (~1h).
#   2. Rolling merge (rolling_enabled): event-driven, merges each segment within
#      seconds of closing. Quasi-real-time (<10s on USB HDD). Higher IO but
#      eliminates file fragmentation. DEFAULTS TO ON. Can run alongside periodic merge.
merge:
  enabled: false                   # Enable periodic segment merging
  check_interval: "1h"             # How often to check for merge candidates
  window_size: "1h"                # Time window for merging segments
  batch_limit: 200                 # Max segments to merge in one batch
  min_segment_age: "10m"           # Minimum age before a segment can be merged
  min_segments_to_merge: 3         # Minimum segments required to trigger a merge

  # Rolling merge (quasi-real-time) — merges segments into per-camera window
  # buckets on SegmentCompleted event. Achieves <10s latency vs ~1h for periodic.
  # DEFAULTS TO ON: continuous 24/7 recording otherwise produces thousands of
  # ~30s fragments per camera per day, making the recordings gallery unusable.
  # Set to false (globally or per-camera) to disable, e.g. for SD-card cameras
  # where you want to avoid the extra write amplification.
  rolling_enabled: true            # Event-driven rolling merge (default true)
  rolling_debounce: "5s"           # Delay after segment close — batches rapid disconnects (default 5s)
  rolling_window: "1h"             # Bucket size — segments within this window merge into one file
  rolling_min_duration: "5m"       # Target minimum merged duration; shorter → merge_quality='short'
  # Startup backfill throttling — caps the first-boot merge workload so an
  # upgrade to default-on rolling merge cannot trigger an IO storm on RPi 3B.
  rolling_backfill_max_segments: 500  # Max segments merged at startup (0=unlimited)
  rolling_backfill_max_age: "72h"     # Only backfill segments newer than this; older → periodic merge
  # Periodic backfill sweep — digests historical pending segments that the
  # event-driven path misses (pre-72h backlogs, recorder downtime catch-up).
  rolling_backfill_interval: "10m"    # Sweep cadence (default 10m; "0" to disable)
  rolling_backfill_batch: 500         # Max segments processed per sweep cycle (default 500)
  rolling_backfill_concurrency: 0     # Cameras merged in parallel (0=auto: 1 on ≤2GB RAM, 3 otherwise). Lower if recording drops frames during backlog clearing.

# FTP server — provides file access over FTP protocol
# Configurable port and passive port range
ftp:
  enabled: true                    # Enable FTP server (default: true)
  port: 2121                       # FTP control port (1-65535)
  passive_port_range: "2122-2140"  # Passive mode port range

# MQTT trigger-based recording for smart home integration
# When enabled, subscribe to topic for recording triggers
mqtt:
  enabled: false                   # Enable MQTT client
  broker: "tcp://localhost:1883"   # MQTT broker URL
  topic: "mibeenr/trigger"         # MQTT topic to subscribe to
  client_id: "mibee-nvr"           # MQTT client ID
  username: ""                     # MQTT broker authentication (optional)
  password: ""                     # MQTT broker password (optional, auto-encrypted if encryption key is set)

# WebDAV server — file access over WebDAV protocol
# Shares recordings directory over HTTP
webdav:
  enabled: true                    # Enable WebDAV server (default: true)
  path_prefix: "/dav"              # URL path prefix for WebDAV access
  read_write: false                # Allow write operations (PUT, MKCOL, DELETE, etc.)

# HLS streaming — on-demand live view via Web UI
# RPi constraint: max 4 concurrent streams
hls:
  write_buffer_size: 40            # Async frame buffer per stream (default: 100)
  segment_max_size_mb: 10          # HLS segment max size in MB (default: 10)
  segment_count: 7                 # Segments per stream (range: 3-10, default: 7)
  max_streams: 4                   # Max concurrent HLS streams (range: 1-20, default: 4)
  low_latency: false               # Enable Low-Latency HLS (default: false)
  part_min_duration: "200ms"       # LL-HLS part duration (range: 100ms-1s, default: 200ms)

# Observability — logging and debugging
observability:
  log_level: "info"                # Log level: debug, info, warn, error (default: info)
  log_format: "text"               # Log format: json or text (default: text)
  # enable_pprof: false            # Enable pprof debug endpoints (default: false)

# Transcoding — optional video transcoding via FFmpeg
# Used to reduce bitrate, change codec format, or adjust quality
# Requires ffmpeg to be installed on the system
# transcoding:
#   enabled: false              # Enable transcoding (default: false)
#   ffmpeg_path: ""              # Path to ffmpeg binary (empty = auto-detect)
#   max_workers: 1               # Max concurrent transcoding jobs (range: 1-4, default: 1)
#   replace_original: false      # Replace original recordings with transcoded versions
#   download_url: ""             # Auto-populated FFmpeg download URL per platform
#
# Per-camera transcoding overrides:
#   cameras:
#     - id: "front-door"
#       ...
#       transcoding:
#         enabled: true           # Override global enabled for this camera
#         target_codec: "h264"    # Target codec: h264, h265 (default: same as source)
#         preset: "ultrafast"     # FFmpeg preset: ultrafast, faster, medium (default: ultrafast)
#         bitrate: "2M"           # Target bitrate (e.g. "1M", "2M", "500K")

# Streaming — default live view protocol and per-protocol settings
# streaming:
#   default_protocol: "hls"          # Default streaming protocol: hls, ll-hls, webrtc, flv (default: hls)
#   webrtc:
#     enabled: true                   # Enable WebRTC WHEP streaming (default: true)
#     max_viewers: 2                  # Max concurrent WebRTC viewers (range: 1-10, default: 2)
#     idle_timeout: "60s"             # WebRTC viewer idle timeout (default: 60s)
#     # Cross-network (WAN / 4G / remote WiFi) WebRTC access requires ICE servers.
#     # Leave empty for LAN-only deployments (the default — preserves legacy behavior).
#     # See docs/{zh,en}/remote-access.md for STUN/TURN setup and tunnel options.
#     # ice_servers:
#     #   - urls: ["stun:stun.l.google.com:19302"]            # public Google STUN
#     #   - urls: ["turn:turn.example.com:3478?transport=udp"] # TURN needs creds
#     #     username: "user"
#     #     credential: "pass"
#   flv:
#     enabled: true                   # Enable HTTP-FLV streaming (default: true)
#     max_viewers: 10                 # Max concurrent FLV viewers (range: 1-50, default: 10)
#     idle_timeout: "60s"             # FLV viewer idle timeout (default: 60s)
#     gop_cache_size: 1               # FLV GOP cache size (default: 1)

# WebSocket streaming — binary frame streaming
# websocket:
#   max_viewers: 10                  # Max concurrent WebSocket viewers (default: 10)
#   write_buf_size: 100               # WebSocket write buffer size (default: 100)
#   idle_timeout: "60s"               # WebSocket idle timeout (default: 60s)

# Camera health monitoring — automatic health detection and remediation
# health:
#   enabled: false                   # Enable health monitoring (default: false)
#   events_retention: "720h"          # Health events retention duration (default: 720h / 30 days)
#   alerts:
#     cooldown: "5m"                 # Alert cooldown between notifications (default: 5m)
#     mqtt: false                     # Send health alerts via MQTT (default: false)
#   layer1:
#     offline_threshold: "30s"        # Timeout before declaring camera offline (default: 30s)
#   layer2:
#     bitrate_change_threshold: 0.5   # Max bitrate change ratio (0-1, default: 0.5)
#     min_fps: 5                      # Minimum acceptable FPS (default: 5)
#     max_idr_interval: "60s"          # Max IDR interval (default: 60s)
#   layer2_5:
#     freeze_timeout: "10s"           # Timeout for detecting frozen stream (default: 10s)
#   auto_remediation:
#     enabled: false                  # Enable automatic camera restart (default: false)
#     max_restarts_per_hour: 3         # Max restarts per hour per camera (default: 3)
#     cooldown_minutes: 5             # Cooldown between restarts in minutes (default: 5)
#     blacklist_hours: 1              # Hours to blacklist camera after repeated failures (default: 1)
#     global_max_per_min: 10          # Max restarts across all cameras per minute (default: 10)
#     reconnecting_timeout_minutes: 10 # Min time in reconnecting before hard restart (default: 10)
#     rediscovery_rescan_minutes: 5   # Re-attempt IP rediscovery during blacklist (default: 5, 0=disabled)

# Remote logging — send logs to external HTTP endpoint
# remote_log:
#   enabled: false                   # Enable remote logging (default: false)
#   endpoint: ""                      # HTTP endpoint URL for log delivery
#   format: "jsonline"               # Log format: jsonline, loki (default: jsonline)

# AI inference — ONNX Runtime object detection
# ai:
#   inference_timeout_ms: 5000        # Inference timeout in ms (default: 5000)
#   frame_skip_rate: 10              # Process every Nth frame (default: 10)
#   confidence_threshold: 0.5         # Detection confidence threshold (default: 0.5)
#   model_path: ""                   # Path to ONNX model (empty = auto-download)

# RTMP ingest server — receive RTMP push streams
# rtmp:
#   enabled: false                   # Enable RTMP server (default: false)
#   port: 1935                       # RTMP listen port (default: 1935)
#   stream_keys: {}                  # Camera ID to stream key mapping (e.g. front-door: mykey)

# SRT listener — receive SRT/MPEG-TS streams
# srt:
#   enabled: false                   # Enable SRT listener (default: false)
#   port: 9000                       # SRT listen port (default: 9000)
#   streams: []                      # SRT stream mappings (camera_id, mode, address, passphrase, stream_id)

# Metrics authentication — optional BasicAuth for /metrics endpoint
# metrics_auth:
#   username: ""                     # Metrics endpoint username (empty = public access)
#   password: ""                     # Metrics endpoint password
#   password_hash: ""                 # Metrics endpoint password hash (bcrypt)

# In-app version check (sensing layer ONLY — never executes an upgrade).
# The backend polls GitHub Releases with ETag conditional requests (304s do not
# count against the unauthenticated rate limit) and exposes the result at
# /api/update/check + /api/version for the UI to show a "new version" badge.
# Real upgrades are done by an external tool (Watchtower), the NAS app store, or
# `docker compose pull && up -d`.
# update:
#   enabled: true                     # Gate the background check (default: true)
#   channel: "stable"                 # Release stream; only "stable" implemented
#   check_interval: "1h"              # Poll cadence (time.Duration; min 1m)
#   repo: "Mi-Bee-Studio/MiBeeNvr"   # GitHub "owner/name" to check

# Extensions — arbitrary key-value pairs for external module config passthrough.
# MiBeeNvr core does NOT read or validate these. Use for out-of-module service
# extensions registered via pkg/app.App.Register. Unknown keys are silently ignored.
# extensions:
#   example_key: example_value
