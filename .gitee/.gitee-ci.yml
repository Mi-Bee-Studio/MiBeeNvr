# Gitee Go CI 流水线配置
# 触发条件：推送 v 开头的标签（如 v1.0.0）
version: '1.0'
name: release-pipeline
displayName: 构建并发布MiBeeNvr

triggers:
  push:
    tags:
      include:
        - "v*"

stages:
  - stage:
      name: build
      displayName: 构建
      steps:
        # ---- 前端构建 ----
        - step: build@node
          name: build_frontend
          displayName: 构建前端
          nodeVersion: 22
          commands:
            - set -e
            - cd web
            - npm ci
            - npm run build
            - cp -r dist/* ../internal/ui/static/
          artifacts:
            - name: FRONTEND_ARTIFACT
              path:
                - ./internal/ui/static

        # ---- Go 交叉编译 ----
        - step: build@golang
          name: build_amd64
          displayName: 编译 amd64
          golangVersion: 1.26
          commands:
            - set -e
            - export GOPROXY=https://goproxy.cn,direct
            - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mibee-nvr-linux-amd64 ./cmd/mibee-nvr/
          artifacts:
            - name: AMD64_ARTIFACT
              path:
                - ./mibee-nvr-linux-amd64
          dependsOn: build_frontend

        - step: build@golang
          name: build_arm64
          displayName: 编译 arm64
          golangVersion: 1.26
          commands:
            - set -e
            - export GOPROXY=https://goproxy.cn,direct
            - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mibee-nvr-linux-arm64 ./cmd/mibee-nvr/
          artifacts:
            - name: ARM64_ARTIFACT
              path:
                - ./mibee-nvr-linux-arm64
          dependsOn: build_frontend

  - stage:
      name: package
      displayName: 打包
      steps:
        - step: publish@general_artifacts
          name: upload_amd64
          displayName: 上传 amd64 制品
          dependArtifact: AMD64_ARTIFACT
          artifactName: mibee-nvr-amd64
          dependsOn: build_amd64

        - step: publish@general_artifacts
          name: upload_arm64
          displayName: 上传 arm64 制品
          dependArtifact: ARM64_ARTIFACT
          artifactName: mibee-nvr-arm64
          dependsOn: build_arm64

  - stage:
      name: release
      displayName: 发布Release
      steps:
        - step: publish@release_artifacts
          name: publish_release
          displayName: 发布到Release
          dependArtifact: mibee-nvr-amd64
          version: '${GITEE_TAG}'
          autoIncrement: false
