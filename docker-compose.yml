# MiBee NVR — Docker Compose
# Usage:
#   1. mkdir -p data
#   2. cp config.example.yaml data/mibee-nvr.yaml
#   3. Edit data/mibee-nvr.yaml (set password, add cameras)
#   4. docker compose up -d
#   5. Open http://localhost:9090
#
# Networking:
#   By default, this uses bridge networking with port mapping.
#   ONVIF WS-Discovery (UDP multicast) does NOT work in bridge mode.
#   To enable ONVIF auto-discovery, uncomment "network_mode: host"
#   and remove the "ports" section below.

services:
  mibee-nvr:
    image: ghcr.io/mi-bee-studio/mibeenvr:latest
    container_name: mibee-nvr
    restart: unless-stopped

    # Uncomment the line below to use host networking.
    # This is required for ONVIF WS-Discovery auto-scan to work,
    # and may improve WebRTC/FLV streaming performance.
    # When using host mode, REMOVE the "ports" section below
    # (port mappings are ignored in host mode).
    # network_mode: host

    ports:
      - "9090:9090"   # Web UI / API
      - "2121:2121"   # FTP
      - "2122-2140:2122-2140"  # FTP passive ports
    volumes:
      - ./data:/data
    environment:
      - NVR_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "mibee-nvr", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # 用户权限说明：
    # 默认以 nonroot (UID 65534) 运行，安全性更高。
    # 如果遇到 unable to open database file 等权限错误，
    # 可取消注释下面这行以 root 用户运行：
    # 注意：对于已存在的卷，若文件属主为 root，请先执行：
    #   sudo chown -R 65534:65534 ./data
    # user: "0:0"
