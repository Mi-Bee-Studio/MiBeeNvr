version: '1.0'
name: pr-pipeline
displayName: PR 构建
stages:
  - stage:
      name: compile
      displayName: 编译验证
      steps:
        - step: build@node
          name: build_check
          displayName: Go编译验证
          nodeVersion: 22
          commands: |
            set -e

            # ---- 安装 Go 1.26 ----
            export GO_VERSION=1.26.4
            export GO_TARBALL=go${GO_VERSION}.linux-amd64.tar.gz
            wget -q https://go.dev/dl/${GO_TARBALL} -O /tmp/${GO_TARBALL}
            tar -C /usr/local -xzf /tmp/${GO_TARBALL}
            export PATH=/usr/local/go/bin:$PATH
            export GOPROXY=https://goproxy.cn,direct
            go version

            # ---- 编译验证（不做前端，PR 只验证后端编译） ----
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" ./cmd/mibee-nvr/

triggers:
  pr:
    branches:
      include:
        - master
        - main
