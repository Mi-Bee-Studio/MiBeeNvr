version: '1.0'
name: master-pipeline
displayName: Master 构建
stages:
  - stage:
      name: build
      displayName: 构建
      steps:
        - step: build@node
          name: build_all
          displayName: 前端+Go编译
          nodeVersion: 22
          commands: |
            set -e

            # ---- 安装 Go 1.26 ----
            export GO_VERSION=1.26.4
            export GO_TARBALL=go${GO_VERSION}.linux-amd64.tar.gz
            wget -q https://go.dev/dl/${GO_TARBALL} -O /tmp/${GO_TARBALL}
            tar -C /usr/local -xzf /tmp/${GO_TARBALL}
            export PATH=/usr/local/go/bin:$PATH
            export GOPROXY=https://goproxy.cn,direct
            go version

            # ---- 构建前端 ----
            cd web
            npm ci
            npm run build
            cp -r dist/* ../internal/ui/static/
            cd ..

            # ---- 交叉编译 ----
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mibee-nvr-linux-amd64 ./cmd/mibee-nvr/
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mibee-nvr-linux-arm64 ./cmd/mibee-nvr/
          artifacts:
            - name: BUILD_ARTIFACT
              path:
                - ./mibee-nvr-linux-amd64
                - ./mibee-nvr-linux-arm64

        - step: publish@general_artifacts
          name: publish_artifacts
          displayName: 上传制品
          dependArtifact: BUILD_ARTIFACT
          artifactName: output
          dependsOn: build_all

  - stage:
      name: release
      displayName: 发布
      steps:
        - step: publish@release_artifacts
          name: publish_release
          displayName: 发布到Release
          dependArtifact: output
          version: '1.0.0.0'
          autoIncrement: true

triggers:
  push:
    branches:
      include:
        - master
        - main
