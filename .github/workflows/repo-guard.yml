name: repo-guard

# Repository structure guards (docs/architecture/CONVENTIONS.md).
# Cheap, dependency-free checks that catch drift the normal lint/test jobs
# cannot see: forbidden root directories, oversized new files, and the
# internal→pkg dependency inversion.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forbidden root directories
        run: |
          set -eu
          bad=""
          for d in scripts tools dist dist2 tmp-probe web_embed pkg; do
            # Only tracked directories matter: build/ and tmp-probe/ are
            # gitignored local scratch and are not present on a clean checkout.
            if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then bad="$bad $d"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Forbidden top-level directories present:$bad"
            echo "See docs/architecture/CONVENTIONS.md §1. Repo tooling lives in tests/;"
            echo "build output belongs in build/ or internal/ui/static/ (both gitignored)."
            exit 1
          fi
          echo "OK: no forbidden root directories"

      - name: internal must not import pkg
        run: |
          set -eu
          # pkg/ is gone (CONVENTIONS §5); any import of it is a regression.
          hits=$(grep -rn 'MiBeeNvr/pkg/' internal/ --include='*.go' | grep -v '_test.go' || true)
          if [ -n "$hits" ]; then
            echo "::error::internal→pkg dependency reintroduced (CONVENTIONS §2/§5)."
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK: no internal→pkg imports"

      - name: Changed Go files under 1200 lines
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          head="${{ github.event.pull_request.head.sha || 'HEAD' }}"
          files=$(git diff --name-only --diff-filter=AM "$base" "$head" -- '*.go' | grep -v '_test.go' || true)
          [ -z "$files" ] && { echo "no changed Go files"; exit 0; }
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f")
            if [ "$n" -gt 1200 ]; then
              echo "::error file=$f::file has $n lines (limit 1200, CONVENTIONS §3)"
              fail=1
            fi
          done <<EOF2
          $files
          EOF2
          exit $fail

      - name: No private paths or secrets patterns
        run: |
          set -eu
          # Guard against the historical docs/private/ pattern coming back and
          # against literal internal addresses in tracked files.
          fail=0
          if git ls-files | grep -q '^docs/private/'; then
            echo "::error::docs/private/ must stay out of the repo (CONVENTIONS §7)"
            fail=1
          fi
          addr=$(git grep -nE '192\.168\.(63|62)\.[0-9]+' -- '*.go' '*.md' '*.ts' '*.svelte' || true)
          if [ -n "$addr" ]; then
            echo "::warning::internal addresses found in tracked sources — verify they are examples"
            printf '%s\n' "$addr" | head -5
          fi
          exit $fail
