name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true


      - name: Test
        run: go test -race -timeout 5m -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold..."
          total=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//' )
          echo "Total coverage: $total%"
          if (( $(echo "$total < 55" | bc -l) )); then
            echo "Coverage $total% is below threshold of 55%"
            exit 1
          fi
          echo "Coverage threshold check passed"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
  build:
    runs-on: ubuntu-latest
    # Run in parallel with test — build validates compilation; test validates correctness.
    # Both signals are useful ASAP. Total CI time = max(test, build) instead of test+build.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Build
        run: |
          cp -r web/dist/* internal/ui/static/
          CGO_ENABLED=0 go build -trimpath ./cmd/mibee-nvr/
