# Weekly upstream-drift sentinel for the HA integration (#1162 residual).
# The per-push home-assistant job in ci.yml already runs ruff + pytest against
# the pinned homeassistant version, but only when repo activity triggers CI —
# an upstream HA move between pin bumps lands silently. This schedule runs the
# same test suite with no repo activity, so drift is caught (and dated) even
# when the repo is quiet.
name: ha-drift

on:
  schedule:
    - cron: "21 5 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/home-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # homeassistant >= 2026.3 requires Python >= 3.14.2 — the
          # alert-clearing pin floor (2026.7.x) is unreachable on 3.13.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: deploy/home-assistant/requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -v
