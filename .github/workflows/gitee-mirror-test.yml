# TEMPORARY e2e harness for the mirror-to-gitee job in release.yml — delete
# after validation. Step-for-step copy of that job's three steps; the only
# difference is TAG as a workflow_dispatch input, because dispatching
# release.yml on an old tag ref executes THAT TAG's copy of release.yml (which
# predates the job) and dispatching on main would re-run the whole release
# (junk "main" release + unconditional ghcr `latest` push).
name: gitee-mirror-test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g. v0.12.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror-to-gitee-test:
    # Same gating expression as the real job minus the tag-ref guard (the
    # guard's `vars.X` half is exercised here; `startsWith` is a builtin).
    if: vars.ENABLE_GITEE == 'true'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: pushing the tag below must carry its full ancestry — a
      # shallow clone cannot push the tag's history to gitee.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir gitee-assets
          # Only fetch what Gitee will accept — assets ≤100MB (Gitee's
          # single-attachment cap; skips the ~160MB .fpk bundles)
          gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}" \
            --jq '.assets[] | select(.size <= 104857600) | .name' \
          | while read -r name; do
              gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" \
                --pattern "$name" --dir gitee-assets --clobber
            done

      - name: Push tag to the Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git push "https://mickeybee:${GITEE_TOKEN}@gitee.com/Mi-Bee-Studio/MiBeeNvr.git" \
            "refs/tags/${{ inputs.tag }}"

      - name: Attach assets to the Gitee release
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/Mi-Bee-Studio/MiBeeNvr"
          AUTH="Authorization: Bearer ${GITEE_TOKEN}"
          # Gitee quirks (verified against the live API): GET releases/tags/{tag}
          # answers 200 with body `null` when the release does not exist — test
          # the parsed id, not the HTTP code; POST /releases demands a
          # target_commitish field (empty string is fine when the tag exists);
          # attachments upload under the multipart field `file` (NOT `files[]`)
          # and DELETE attach_files/{id} returns 204.
          REL_ID=$(curl -sf -H "$AUTH" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -z "${REL_ID}" ]; then
            PRE=$(gh release view "$TAG" -R "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)
            REL_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"target_commitish\":\"\",\"prerelease\":${PRE:-false},\"body\":\"MiBee NVR ${TAG} — 完整发布说明（含更新日志）见 GitHub：https://github.com/${{ github.repository }}/releases/tag/${TAG}\"}" \
              "${API}/releases" | jq -r '.id')
          fi
          echo "Gitee release id: ${REL_ID}"
          for f in gitee-assets/*; do
            name=$(basename "$f")
            # Replace same-named attachments so a re-run always converges to
            # exactly the GitHub release's asset set
            for aid in $(curl -sf -H "$AUTH" "${API}/releases/${REL_ID}/attach_files" | jq -r --arg n "$name" '(. // [])[] | select(.name == $n) | .id'); do
              echo "delete stale attachment ${name} (id ${aid})"
              curl -sf -X DELETE -H "$AUTH" "${API}/releases/${REL_ID}/attach_files/${aid}"
            done
            echo "upload ${name} ($(du -h "$f" | cut -f1))"
            curl -sf --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 \
              -X POST -H "$AUTH" -F "file=@${f}" \
              "${API}/releases/${REL_ID}/attach_files" >/dev/null
            sleep 1  # Gitee throttles aggressive API bursts
          done
