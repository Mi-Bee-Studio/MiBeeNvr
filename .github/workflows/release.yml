name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 5m -coverprofile=coverage.out ./...

      - name: Build frontend
        run: cd web && npm ci && npm run build && cp -r dist/* ../internal/ui/static/

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.appVersion=${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-amd64 ./cmd/mibee-nvr/ &
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-arm64 ./cmd/mibee-nvr/ &
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-armv7 ./cmd/mibee-nvr/ &
          wait

      - name: Update release assets
        uses: softprops/action-gh-release@v2
        with:
          # Only upload binaries, preserve existing release body if already set
          generate_release_notes: true
          append_body: true
          files: |
            mibee-nvr-amd64
            mibee-nvr-arm64
            mibee-nvr-armv7

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Offline fnOS .fpk -------------------------------------------------------
  # Produces the self-contained fnOS installer (both arch images docker-saved
  # into the .fpk) and attaches it to the Release, so fnOS users install with no
  # ghcr.io pull — the main cause of slow mainland-China installs. Fully additive:
  # if it fails, the release (binaries + image) is already complete; re-run or
  # build locally with ./deploy/fnos/build.sh instead.
  fnos-fpk:
    needs: release
    # build.sh validates VERSION against ^[0-9]+\.[0-9]+\.[0-9]+$; on
    # workflow_dispatch github.ref_name is a branch name, which would hard-fail
    # that check. The offline fpk is only meaningful on a real tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download fnpack 1.2.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fnpack" \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x "$RUNNER_TEMP/fnpack"
          # build.sh reads FNPACK_BIN; keep it outside the checkout so it can't
          # leak into any artifact.
          echo "FNPACK_BIN=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"

      - name: Resolve fpk version (strip leading v)
        # manifest.version + the bundled image tag must be X.Y.Z (no 'v') to
        # match build.sh's gate and the mibee-nvr:${VERSION} compose reference.
        # The in-app version string INSIDE the image keeps the 'v' via the
        # build-arg below, matching the pushed registry image.
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # buildx --load supports only ONE platform per invocation, so we build
      # each arch separately into the local daemon with the tag build.sh expects
      # (mibee-nvr:<ver>-<arch>). type=gha reuses the cache the release job
      # warmed, so these are mostly cache hits.
      - name: Build amd64 image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mibee-nvr:${{ steps.ver.outputs.version }}-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: mibee-nvr:${{ steps.ver.outputs.version }}-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build offline .fpk
        run: ./deploy/fnos/build.sh ${{ steps.ver.outputs.version }}

      - name: Attach .fpk to the Release
        uses: softprops/action-gh-release@v2
        with:
          # Only attach the file — never touch the release body (it is curated
          # by hand per RELEASE_NOTES.md). append_body:false keeps it file-only.
          files: deploy/fnos/*.fpk
          append_body: false
