name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Tag-only: the workflow_dispatch trigger exists to test the dmg job —
    # without a tag there is no release to attach assets to, and this job
    # would burn 12 minutes just to fail at "Update release assets".
    # Tag-gating release also skips its dependents (fpk/mirrors) on dispatch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 5m -coverprofile=coverage.out ./...

      - name: Build frontend
        run: cd web && npm ci && npm run build && cp -r dist/* ../internal/ui/static/

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.appVersion=${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-amd64 ./cmd/mibee-nvr/ &
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-arm64 ./cmd/mibee-nvr/ &
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-armv7 ./cmd/mibee-nvr/ &
          # -H windowsgui: the windows binary is a tray app — the GUI
          # subsystem means Windows never allocates a console for desktop
          # launches (no cmd window to linger or close-kills-the-server).
          # Terminal output is reconstructed in-process (AttachConsole,
          # internal/install/console_windows.go).
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS -H windowsgui" -o mibee-nvr-windows-amd64.exe ./cmd/mibee-nvr/ &
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-darwin-arm64 ./cmd/mibee-nvr/ &
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o mibee-nvr-darwin-amd64 ./cmd/mibee-nvr/ &
          wait
          # Single-file windows installer (2026-09-18): the Setup exe IS the
          # server binary — a bare double-click installs (desktop_entry.go).
          cp mibee-nvr-windows-amd64.exe "MiBeeNVR-Setup-${{ github.ref_name }}-windows-amd64.exe"

      # ---- Artifact integrity (#646) ------------------------------------------
      # checksums.txt (sha256sum format) + a raw 64-byte ed25519 signature over
      # it, verified in-process by internal/update (pure Go, stdlib ed25519 —
      # the interop contract is locked by TestVerifyChecksumsSignature_OpenSSLInterop).
      # The matching public key is embedded in internal/update/verify.go and
      # shipped as PEM in deploy/keys/release-signing.pub.pem.
      # If RELEASE_SIGNING_KEY is unset the checksums still upload, unsigned —
      # a missing secret must never block a release (same policy as the ACR
      # mirror job).
      - name: Generate checksums and signature
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          sha256sum mibee-nvr-amd64 mibee-nvr-arm64 mibee-nvr-armv7 \
            mibee-nvr-windows-amd64.exe mibee-nvr-darwin-arm64 mibee-nvr-darwin-amd64 \
            "MiBeeNVR-Setup-${{ github.ref_name }}-windows-amd64.exe" \
            > checksums.txt
          cat checksums.txt
          if [ -n "${SIGNING_KEY}" ]; then
            printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release-signing.key"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-signing.key" \
              -rawin -in checksums.txt -out checksums.txt.sig
            rm -f "$RUNNER_TEMP/release-signing.key"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "checksums.txt.sig created"
          else
            echo "::warning::RELEASE_SIGNING_KEY secret not set — checksums.txt uploaded WITHOUT ed25519 signature"
          fi

      - name: Update release assets
        uses: softprops/action-gh-release@v2
        with:
          # Only upload binaries, preserve existing release body if already set
          generate_release_notes: true
          append_body: true
          files: |
            mibee-nvr-amd64
            mibee-nvr-arm64
            mibee-nvr-armv7
            mibee-nvr-windows-amd64.exe
            MiBeeNVR-Setup-${{ github.ref_name }}-windows-amd64.exe
            mibee-nvr-darwin-arm64
            mibee-nvr-darwin-amd64
            checksums.txt

      - name: Attach release signature
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: checksums.txt.sig
          append_body: false

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Prerelease tags (v0.13.0-preview.1 was the first): the exact
          # {{version}} pattern still fires, but the stable aliases (X.Y / X /
          # latest) must keep pointing at the latest STABLE image — gate them
          # off when the tag carries a semver prerelease suffix.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}


      # QEMU is required for multi-arch builds (amd64/arm64/arm/v7) on the x86_64
      # GHA runner. buildx auto-pulls QEMU in some builders, but adding it
      # explicitly avoids breakage when the default builder image changes.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No provenance/SBOM attestations: buildx attaches them as extra
          # manifest-list entries (application/vnd.oci.empty.v1+json), which the
          # Alibaba Cloud ACR mirror rejects with
          # "denied: unknown manifest class" — breaking mirror-to-acr. ghcr
          # works with or without them; ACR compatibility wins.
          provenance: false
          sbom: false

  # ---- Offline fnOS .fpk -------------------------------------------------------
  # Produces the self-contained fnOS installer (both arch images docker-saved
  # into the .fpk) and attaches it to the Release, so fnOS users install with no
  # ghcr.io pull — the main cause of slow mainland-China installs. Fully additive:
  # if it fails, the release (binaries + image) is already complete; re-run or
  # build locally with ./deploy/fnos/build.sh instead.
  # macOS single-file installer (2026-09-18): a universal (arm64+amd64) DMG
  # containing MiBeeNVR.app. Double-clicking the app performs the install
  # (desktop_entry.go — same flow as `mibee-nvr install`); uninstall lives in
  # the menu-bar helper and `mibee-nvr uninstall`. Needs a macos runner for
  # lipo/iconutil/hdiutil; also runnable via workflow_dispatch for test
  # builds (artifact upload only, no release attachment without a tag).
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build && cp -r dist/* ../internal/ui/static/

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "DMG_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "DMG_VERSION=test-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build universal binary
        run: |
          LDFLAGS="-s -w -X main.appVersion=${DMG_VERSION}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o bin/arm64 ./cmd/mibee-nvr/
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o bin/amd64 ./cmd/mibee-nvr/
          lipo -create -output mibee-nvr bin/arm64 bin/amd64
          lipo -info mibee-nvr

      - name: Assemble MiBeeNVR.app
        run: |
          mkdir -p MiBeeNVR.app/Contents/MacOS MiBeeNVR.app/Contents/Resources
          cp mibee-nvr MiBeeNVR.app/Contents/MacOS/mibee-nvr
          cat > MiBeeNVR.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleName</key><string>MiBee NVR</string>
            <key>CFBundleDisplayName</key><string>MiBee NVR</string>
            <key>CFBundleIdentifier</key><string>com.mibee-studio.MiBeeNVR</string>
            <key>CFBundleExecutable</key><string>mibee-nvr</string>
            <key>CFBundleVersion</key><string>__VERSION__</string>
            <key>CFBundleShortVersionString</key><string>__VERSION__</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__VERSION__/${DMG_VERSION}/g" MiBeeNVR.app/Contents/Info.plist
          # App icon from the SPA's 512px source (sips+iconutil ship with macOS).
          mkdir AppIcon.iconset
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" internal/ui/static/icon-512.png --out "AppIcon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz * 2)) $((sz * 2)) internal/ui/static/icon-512.png --out "AppIcon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o MiBeeNVR.app/Contents/Resources/AppIcon.icns
          # Ad-hoc signature: no Apple developer ID (notarization is out of
          # scope) — first launch needs the right-click → 打开 dance either way.
          codesign --force --sign - MiBeeNVR.app

      - name: Create DMG
        run: |
          mkdir staging
          cp -R MiBeeNVR.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "MiBee NVR" -srcfolder staging -ov -format UDZO \
            "MiBeeNVR-${DMG_VERSION}-macOS-universal.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: MiBeeNVR-*-macOS-universal.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MiBeeNVR-*-macOS-universal.dmg

  fnos-fpk:
    needs: release
    # build.sh validates VERSION against ^[0-9]+\.[0-9]+\.[0-9]+$; on
    # workflow_dispatch github.ref_name is a branch name, which would hard-fail
    # that check. The offline fpk is only meaningful on a real tag. Prerelease
    # tags (v0.13.0-preview.1 was the first) still package: the resolve step
    # keeps the fnOS surface label at the plain X.Y.Z base and overrides the
    # image tag with the exact semver (build.sh IMAGE_TAG → cmd/main +
    # compose), so installs load/pull the real preview image.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download fnpack 1.2.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fnpack" \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x "$RUNNER_TEMP/fnpack"
          # build.sh reads FNPACK_BIN; keep it outside the checkout so it can't
          # leak into any artifact.
          echo "FNPACK_BIN=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"

      - name: Resolve fpk version (strip leading v)
        # manifest.version — the fnOS surface label — must be X.Y.Z (no 'v')
        # to match build.sh's gate. The in-app version string INSIDE the image
        # keeps the 'v' via the build-arg below, matching the pushed registry
        # image. Prerelease tags: the surface label stays the plain X.Y.Z base
        # (0.13.0) while image_tag carries the exact semver (0.13.0-preview.1)
        # — compose and cmd/main load/pull the real preview image, never a
        # future stable of the same X.Y.Z.
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER%%-*}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # buildx --load supports only ONE platform per invocation, so we build
      # each arch separately into the local daemon with the tag build.sh expects
      # (mibee-nvr:<ver>-<arch>). type=gha reuses the cache the release job
      # warmed, so these are mostly cache hits.
      - name: Build amd64 image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mibee-nvr:${{ steps.ver.outputs.image_tag }}-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: mibee-nvr:${{ steps.ver.outputs.image_tag }}-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build offline .fpk
        run: IMAGE_TAG=${{ steps.ver.outputs.image_tag }} ./deploy/fnos/build.sh ${{ steps.ver.outputs.version }}

      - name: Attach .fpk to the Release
        uses: softprops/action-gh-release@v2
        with:
          # Only attach the file — never touch the release body (it is curated
          # by hand per RELEASE_NOTES.md). append_body:false keeps it file-only.
          files: deploy/fnos/*.fpk
          append_body: false

  # ---- Mirror to Alibaba Cloud ACR (mainland-China fast pull) -----------------
  # Copies the multi-arch manifest list from ghcr to ACR via skopeo so mainland-
  # China NAS users can `docker pull` anonymously, sidestepping ghcr's slow /
  # unreliable cross-border pull (the single biggest source of slow CN installs;
  # see deploy/fnos/build.sh). OPT-IN: set repo Variable ENABLE_ACR=true AND
  # Secrets ACR_USERNAME/ACR_PASSWORD. Disabled by default — a missing/incorrect
  # ACR secret must NEVER block a release, so this job is simply skipped and the
  # ghcr image (already pushed by the `release` job) remains the source of truth.
  # ACR personal tier accepts externally-built multi-arch manifests; skopeo
  # --all copies the whole manifest list (all arches), not a single arch.
  # The ONLINE fnOS package (fnos-fpk-online below) hard-depends on this job:
  # the online .fpk pulls from ghcr-or-ACR at install time, so the ACR copy
  # must exist before the package is attached to the release.
  mirror-to-acr:
    needs: release
    if: vars.ENABLE_ACR == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Tags are derived from GITHUB_REF_NAME directly. Do NOT inject
      # docker/metadata-action's multi-line `outputs.tags` expression into the
      # `for` line — the newlines break the generated script with
      # "syntax error near unexpected token" (first seen on the v0.11.0 run,
      # where this job executed for the first time ever).
      - name: Mirror multi-arch images ghcr → ACR (skopeo)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
          ACR_REPO: mickeybeehome/mibee-nvr
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"          # v0.11.0 → 0.11.0
          MAJOR="${VER%%.*}"                  # 0
          MINOR="${VER%.*}"                   # 0.11
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          # Prerelease tags (semver -suffix, e.g. 0.13.0-preview.1): mirror the
          # exact version only. "${VER%.*}" would yield the nonexistent
          # "0.13.0-preview" (first seen on v0.13.0-preview.1), and the X.Y /
          # X / latest aliases must keep pointing at the latest STABLE.
          if [[ "$VER" == *-* ]]; then
            tags=("$VER")
          else
            tags=("$VER" "$MINOR" "$MAJOR" latest)
          fi
          for tag in "${tags[@]}"; do
            echo "::group::Mirror tag ${tag}"
            skopeo copy --all --retry-times 3 \
              "docker://ghcr.io/mi-bee-studio/mibeenvr:${tag}" \
              "docker://${ACR_REGISTRY}/${ACR_REPO}:${tag}" \
              --src-creds "${GHCR_USER}:${GHCR_TOKEN}" \
              --dest-creds "${ACR_USERNAME}:${ACR_PASSWORD}"
            echo "::endgroup::"
          done

  # ---- Online fnOS .fpk -------------------------------------------------------
  # Tiny (~KB) package without bundled images: cmd/main probes ghcr vs the ACR
  # mirror at first start and pulls the multi-arch image from the faster one.
  # HARD DEPENDENCY on mirror-to-acr: the ACR copy of the just-released image
  # must exist before this package ships, otherwise mainland-China installs
  # would fall back to a slow ghcr pull (or fail when ghcr is unreachable and
  # ACR still holds the previous version). When the mirror job is skipped
  # (ENABLE_ACR unset), this job is skipped too — attach it manually after a
  # manual mirror with ./deploy/fnos/build.sh --online <ver> if ever needed.
  fnos-fpk-online:
    needs: mirror-to-acr
    # Prerelease tags package too: cmd/main's baked NVR_IMAGE_TAG pulls the
    # exact semver tag (0.13.0-preview.1), which mirror-to-acr guarantees to
    # exist on BOTH registries for the exact-tag mirror. The surface label
    # (manifest.version) stays the plain X.Y.Z base, same as the offline fpk.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download fnpack 1.2.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fnpack" \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "FNPACK_BIN=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"

      - name: Resolve fpk version (strip leading v)
        # Same surface/image-tag split as the offline fnos-fpk: version = X.Y.Z
        # base (surface label), image_tag = exact semver (pull target).
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER%%-*}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build online .fpk
        run: IMAGE_TAG=${{ steps.ver.outputs.image_tag }} ./deploy/fnos/build.sh --online ${{ steps.ver.outputs.version }}

      - name: Attach online .fpk to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/fnos/mibee-nvr-fnos-online-*.fpk
          append_body: false

  # ---- Gitee mirror release (mainland-China download page) -------------------
  # The gitee.com mirror holds EXACTLY ONE version — the latest stable —
  # because Gitee caps total attachment storage. For a stable tag this job
  # pushes the tag (the mirror repo's git sync lags) and find-or-creates the
  # release shell; for a prerelease tag it skips the shell entirely. Either
  # way it then prunes every Gitee release other than the latest stable.
  # It does NOT upload assets: Gitee stalls large POST bodies from
  # GitHub-hosted runner IPs (verified 2026-09-18 — a 65MB attachment made
  # zero byte progress across 4×15min curl retries while a git push seconds
  # earlier succeeded), so assets are uploaded from a mainland-side machine
  # with `deploy/gitee-mirror.sh` after the release. OPT-IN like
  # mirror-to-acr: repo Variable ENABLE_GITEE=true + Secret GITEE_TOKEN.
  # Missing token/variable → job skips, never blocks a release. Re-runs are
  # safe: every step no-ops when the desired state already holds.
  mirror-to-gitee:
    needs: release
    if: vars.ENABLE_GITEE == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: pushing the tag below must carry its full ancestry — a
      # shallow clone cannot push the tag's history to gitee.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push tag to the Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # --force: a mirror reflects the source. Re-pushing a MOVED tag (e.g.
          # v0.13.0-preview.1 was re-pointed after a pipeline fix) is always a
          # non-fast-forward for tag refs — "already exists" without --force
          # (first seen on the v0.13.0-preview.1 re-tag).
          git push --force "https://mickeybee:${GITEE_TOKEN}@gitee.com/Mi-Bee-Studio/MiBeeNvr.git" \
            "refs/tags/${{ github.ref_name }}"

      - name: Create the Gitee release and prune old versions
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/Mi-Bee-Studio/MiBeeNvr"
          AUTH="Authorization: Bearer ${GITEE_TOKEN}"
          KEEP=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.prerelease == false)][0].tag_name')
          echo "latest stable (kept on Gitee): ${KEEP}"
          if [ "${TAG}" = "${KEEP}" ]; then
            # Quirks (verified): GET releases/tags/{tag} answers 200 with body
            # `null` when missing — test the parsed id, not the HTTP code;
            # POST /releases demands a target_commitish field (empty string is
            # fine when the tag exists).
            REL_ID=$(curl -sf -H "$AUTH" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
            if [ -z "${REL_ID}" ]; then
              REL_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"target_commitish\":\"\",\"prerelease\":false,\"body\":\"MiBee NVR ${TAG} — 完整发布说明（含更新日志）见 GitHub：https://github.com/${{ github.repository }}/releases/tag/${TAG}\"}" \
                "${API}/releases" | jq -r '.id')
              echo "created Gitee release ${TAG} (id ${REL_ID})"
            else
              echo "Gitee release ${TAG} already exists (id ${REL_ID})"
            fi
          else
            echo "tag ${TAG} is not the latest stable — no shell on Gitee (stable-only mirror)"
          fi
          # Prune every Gitee release that is not the kept one. Enumerate from
          # the GitHub side — the Gitee releases LIST endpoint drops entries
          # under load.
          for tag in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].tag_name'); do
            [ "${tag}" = "${KEEP}" ] && continue
            id=$(curl -sf -H "$AUTH" "${API}/releases/tags/${tag}" | jq -r '.id // empty')
            if [ -n "${id}" ]; then
              echo "prune Gitee release ${tag} (id ${id})"
              curl -sf -X DELETE -H "$AUTH" "${API}/releases/${id}"
            fi
          done
