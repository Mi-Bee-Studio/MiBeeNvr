name: Base Image

# Builds the pre-built runtime base image (Alpine + FFmpeg + toolchain).
# This runs PERIODICALLY, not on every release — it eliminates QEMU from
# the release Docker build by pre-baking ffmpeg/ffprobe/xz per architecture.
#
# Trigger: manual, monthly cron (security patches), or base.Dockerfile change.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'  # 1st of month, 03:00 UTC
  push:
    branches: [main]
    paths:
      - 'docker/base.Dockerfile'
      - '.github/workflows/base-image.yml'

permissions:
  packages: write

concurrency:
  group: base-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/base.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/mi-bee-studio/mibeenvr-base:v1
            ghcr.io/mi-bee-studio/mibeenvr-base:latest
          cache-from: type=gha,scope=base-image
          cache-to: type=gha,scope=base-image,mode=max
