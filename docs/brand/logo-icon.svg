  <circle cx="128" cy="154" r="31" fill="url(#bodyGrad)"/>
  <circle cx="128" cy="154" r="17" fill="#160d3a"/>
  <circle cx="118" cy="144" r="7" fill="#ffffff" opacity="0.85"/>
