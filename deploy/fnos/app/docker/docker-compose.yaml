# MiBee NVR — fnOS Docker Compose (offline / bundled image).
# fnOS provides environment variables; key ones used here:
#   TRIM_APPDEST  — installed app target directory (/var/apps/mibee-nvr/target)
#   TRIM_PKGVAR   — app runtime data directory (persists across restarts)
#   wizard_port   — port chosen by the user in the install wizard (default 9090)
#
# host networking is REQUIRED for ONVIF auto-discovery (UDP multicast does not
# cross Docker's bridge). fnOS allows apps without a meaningful service_port
# (manifest: checkport=false), which fits a host-network multi-port service.
#
# The image is loaded LOCALLY by cmd/install_init (docker load of the bundled
# mibee-nvr-<arch>.tar), so we reference a registry-less local tag and force
# pull_policy: never — the container must NEVER reach the network for the image
# (that's the whole point of the offline .fpk). The VERSION placeholder below is
# replaced by build.sh at pack time to match manifest.version exactly.
services:
  mibee-nvr:
    image: mibee-nvr:${VERSION}
    container_name: mibee-nvr
    restart: unless-stopped
    network_mode: host
    pull_policy: never
    volumes:
      # Persist recordings / DB / config / models in fnOS app data dir.
      - "${TRIM_PKGVAR}/data:/data"
    environment:
      NVR_DATA_DIR: /data
      # Port from the install wizard (ui/config opens the iframe on the same
      # port via ${wizard_port}). The app reads NVR_LISTEN_PORT to bind it.
      NVR_LISTEN_PORT: "${wizard_port:-9090}"
      # The fnOS desktop embeds the UI in a cross-origin iframe (desktop page
      # origin != the NVR's :wizard_port origin), so CSP frame-ancestors must
      # allow the embedder. Use scheme-sources 'http:'/'https:' so it matches the
      # desktop's non-default port (e.g. http://nas:5666) — 'http://*' would only
      # match port 80 and get rejected. Restrict further in mibee-nvr.yaml
      # (security.frame_ancestors) if your network model requires it.
      NVR_FRAME_ANCESTORS: "'self' http: https:"
    healthcheck:
      test: ["CMD", "mibee-nvr", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
