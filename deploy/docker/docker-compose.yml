# MiBee NVR — Docker Compose
# Usage:
#   1. docker compose up -d
#   2. Open http://localhost:9090
#   3. Complete the setup wizard in the browser
#
# Storage:
#   Recordings and database are stored inside /data in the container.
#   The default volume mount maps ./data on the host to /data in the container.
#   To use a different host directory (e.g. external drive):
#     volumes:
#       - /mnt/external/nvr:/data    # ← change left side to your host path
#   The right side (:data) and NVR_DATA_DIR must always match.
#
# Permissions:
#   The container runs as UID/GID 1000 by default.
#   Make sure the host directory is writable by that user, or set NVR_UID/NVR_GID
#   to match the owner of the host directory.
#
# Networking:
#   By default, this uses bridge networking with port mapping.
#   ONVIF WS-Discovery (UDP multicast) does NOT work in bridge mode.
#   To enable ONVIF auto-discovery, uncomment "network_mode: host"
#   and remove the "ports" section below.
services:
  mibee-nvr:
    image: ghcr.io/mi-bee-studio/mibeenvr:latest
    container_name: mibee-nvr
    restart: unless-stopped

    # Uncomment the line below to use host networking.
    # This is required for ONVIF WS-Discovery auto-scan to work,
    # and may improve WebRTC/FLV streaming performance.
    # When using host mode, REMOVE the "ports" section below
    # (port mappings are ignored in host mode).
    # If the host's 9090 is already in use (e.g. Synology DSM), also set
    #   server.listen: ":8080"   (or any free port) in mibee-nvr.yaml
    # so the container binds a free host port directly.
    # network_mode: host

    ports:
      # Format is "HOST:CONTAINER". The container always listens on 9090.
      # If port 9090 is taken on your host (e.g. Synology DSM), change ONLY
      # the left side, e.g. "8080:9090" → access via http://HOST_IP:8080.
      - "9090:9090"   # Web UI / API
      - "2121:2121"   # FTP
      - "2122-2140:2122-2140"  # FTP passive ports
    volumes:
      - ./data:/data
    environment:
      - NVR_DATA_DIR=/data
      # Match the UID/GID of the host user who owns ./data
      # Defaults to 1000:1000 if omitted
      # - NVR_UID=1000
      # - NVR_GID=1000
    healthcheck:
      test: ["CMD", "mibee-nvr", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      # Opt-in marker for Watchtower: with WATCHTOWER_LABEL_ENABLE=true, Watchtower
      # only updates containers carrying this label, so it manages MiBee NVR and
      # leaves the user's other containers untouched. See docs/en/deployment-autoupdate.md.
      - "com.centurylinklabs.watchtower.enable=true"

  # --------------------------------------------------------------------------- #
  # Optional automatic updates via Watchtower. OFF by default.
  #
  # Enable with:
  #   docker compose --profile auto-update up -d
  #
  # Watchtower pulls a new mibeenvr image on a schedule and recreates ONLY the
  # mibee-nvr container (the label above + WATCHTOWER_LABEL_ENABLE scope it).
  # Recordings/DB/config live in ./data, so recreation never touches your data.
  #
  # ghcr.io is a private/org registry: Watchtower needs credentials to pull.
  # After a one-time `docker login ghcr.io` (use a GitHub PAT with read:packages),
  # mount the resulting ~/.docker/config.json read-only below. Without it the
  # pull fails with a misleading "denied" error.
  #
  # WATCHTOWER_CLEANUP=false deliberately keeps the old image so you can roll
  # back by changing the image tag and recreating. Do NOT combine :latest with
  # cleanup if you want rollback.
  # --------------------------------------------------------------------------- #
  watchtower:
    profiles: ["auto-update"]
    image: containrrr/watchtower:latest
    container_name: mibee-nvr-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Required for ghcr.io auth. Run once on the host:
      #   docker login ghcr.io -u <github-user> --password-stdin  (PAT: read:packages)
      - ~/.docker/config.json:/config.json:ro
    environment:
      # Only manage containers labeled com.centurylinklabs.watchtower.enable=true.
      - WATCHTOWER_LABEL_ENABLE=true
      # Keep old images for rollback (do NOT enable cleanup).
      - WATCHTOWER_CLEANUP=false
      # 6-field cron (sec min hour dom mon dow): check daily at 04:00 (off-peak).
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      # Notifications (Shoutrrr) — uncomment one and fill in:
      # Discord:    WATCHTOWER_NOTIFICATION_URL=discord://webhookid@webhooktoken
      # Telegram:   WATCHTOWER_NOTIFICATION_URL=telegram://<token>@telegram?chats=<chat-id>
      # - WATCHTOWER_NOTIFICATION_URL=discord://webhookid@webhooktoken
      # Conservative mode: only notify, never update (use to evaluate first):
      # - WATCHTOWER_MONITOR_ONLY=true
