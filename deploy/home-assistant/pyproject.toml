[project]
name = "mibeenvr-homeassistant"
version = "0.1.0"
description = "Home Assistant custom integration for MiBee NVR"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501", # long lines in docstrings/URLs
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
