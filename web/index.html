<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Asset hrefs are RELATIVE (./): the same build serves the app at "/" and
         under a gateway/proxy prefix like fnOS "/app/mibee-nvr" (#394). -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#635bff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MiBee NVR" />
    <title>MiBee NVR</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('mibee_nvr_prefs_theme');
          if (theme) {
            theme = JSON.parse(theme);
          }
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Service Worker registration (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Relative registration: scopes to the serving prefix (root, or the
          // gateway base path) instead of always claiming "/".
          navigator.serviceWorker.register('./sw.js').catch(function(e) {
            console.warn('SW registration failed:', e);
          });
        });
      }
    </script>
  </body>
</html>
